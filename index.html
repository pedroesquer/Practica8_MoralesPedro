<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist: This is Taylor Swift</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
        </aside>

        <main>
            <header class="playlist-header">
                <img src="./img/coverTaylor.jpg" alt="Portada de Taylor Swift" class="playlist-cover">
                <div class="playlist-info">
                    <p class="playlist-type">Playlist pública</p>
                    <h1>This is Taylor Swift</h1>
                    <p class="playlist-desc">The essential tracks, all in one playlist</p>
                    <br>
                    <p>Spotify · 85 canciones, 5 hr 24 min</p>
                </div>
            </header>

            <div class="controls">
                <button class="play-button" aria-label="Reproducir">▶</button>
                <button class="like-button" aria-label="Me gusta">
                    <img src="./icons/heart.svg" alt="Dar me gusta">
                </button>
                <button class="download-button" aria-label="Descargar">
                    <img src="./icons/download.svg" alt="Descargar playlist">
                </button>
            </div>

            <section class="songs">
                <div class="songs-header row">
                    <p class="num">#</p>
                    <p class="wide">Título</p>
                    <p class="wide">Álbum</p>
                    <p class="date">Fecha</p>
                    <p class="duration">Duración</p>
                </div>

                <div class="songs-list">
                    <div class="songs-row row">
                        <span class="num">1</span>
                        <div class="song-info-mobile">
                        <div class="song-info wide">
                            <p>The Fate of Ophelia</p>
                            <p>Taylor Swift</p>
                        </div>
                        <p class="wide">The Life of a Showgirl</p>
                        </div>
                        <p class="date">09/10/2025</p>
                        <p class="duration">3:46</p>
                    </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
